# ========================================================
# MACHTIA Adaptive Tutor - Render Blueprint Configuration
# ========================================================
# Deploy as a Web Service on Render (https://render.com)
# Protocol: Model Context Protocol (MCP 2025-11-25)
# Transport: Streamable HTTP & SSE

services:
  - type: web
    name: machtia-tutor-mcp-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: mock
      - key: JUDGE_DEMO
        value: "true"
      - key: NEXT_PUBLIC_JUDGE_DEMO
        value: "true"
      - key: NEXT_PUBLIC_MCP_URL
        value: "https://machtia-tutor-mcp-server.onrender.com/mcp"
      - key: MCP_ALLOWED_ORIGINS
        value: "http://localhost:3000,https://machtia-tutor-mcp-server.onrender.com,https://*.vercel.app"
